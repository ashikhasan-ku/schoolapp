<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent app: Notices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
.card{background:#FFFFFF;border:1px solid #E3E7F2;border-radius:20px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif">
  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="XHome.dc.html" aria-label="Back to home" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #172042">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800">Notices</h1>
        <p style="margin: 0; font-size: 12px; font-weight: 600; color: #8A93AE">Concept · Sample data</p>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" style="min-height: 40px; padding: 0 14px; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid #D5DBEE; border-radius: 20px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{f.label}}</button>
      </sc-for>
    </div>
    <sc-for list="{{notices}}" as="n" hint-placeholder-count="4">
      <article class="card" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-color: {{n.line}}">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="padding: 4px 9px; background: {{n.bg}}; color: {{n.fg}}; border-radius: 9px; font-size: 12px; font-weight: 800">{{n.tag}}</span>
          <span style="font-size: 12px; color: #5A6482">{{n.date}}</span>
        </div>
        <h2 style="margin: 0; font-size: 16px; line-height: 1.35; font-weight: 800">{{n.title}}</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5A6482">{{n.body}}</p>
        <sc-if value="{{n.needsAck}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{n.ack}}" style="min-height: 44px; background: #2F45A0; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Got it</button>
        </sc-if>
        <sc-if value="{{n.acked}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 13px; font-weight: 700; color: #16705A">You confirmed you read this · the school can see it</p>
        </sc-if>
      </article>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 14px; background: #FFFFFF; border-top: 1px solid #E3E7F2">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; color: {{tab.color}}; font-size: 11px; font-weight: 700; text-decoration: none">
        <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; background: {{tab.pill}}; border-radius: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg></span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { filter: 'All', acked: [] };
  renderVals() {
    const active = 'Home';
    const tabs = [
      { label: 'Home', href: 'XHome.dc.html', d: 'M3 11l9-8 9 8M5 10v10h14V10' },
      { label: 'Messages', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
      { label: 'Calendar', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Fees', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { label: 'Services', href: 'XServices.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' }
    ].map((t) => ({ ...t, color: t.label === active ? '#2F45A0' : '#5A6482', pill: t.label === active ? '#E9EDFB' : 'transparent' }));
    const look = {
      Exams: { bg: '#EEEAFB', fg: '#45318C' }, Fees: { bg: '#FDF0DA', fg: '#6B4004' },
      Class: { bg: '#E2F4EE', fg: '#0E4436' }, School: { bg: '#E2EFFB', fg: '#174E83' }
    };
    const acked = this.state.acked;
    const all = [
      { id: 1, tag: 'Exams', date: 'Yesterday', title: 'Half-yearly exam routine for Class IV', body: 'Exams begin on 22 November. Each paper starts at 9 am.', ack: true },
      { id: 2, tag: 'Fees', date: '5 Nov', title: 'November fee is due by 30 November', body: 'BDT 7,800 for Class IV. Pay in the app and get your receipt instantly.', ack: false },
      { id: 3, tag: 'Class', date: '4 Nov', title: 'Class IV science fair on 18 November', body: 'Students should bring their project files on the day.', ack: true },
      { id: 4, tag: 'School', date: '2 Nov', title: 'School closed on 16 December for Victory Day', body: 'Classes continue on the next school day.', ack: false }
    ].map((n) => {
      const done = acked.includes(n.id);
      return { ...n, ...look[n.tag], needsAck: n.ack && !done, acked: done, line: n.ack && !done ? '#C9D3F3' : '#E3E7F2', ack: () => this.setState({ acked: [...acked, n.id] }) };
    });
    const filters = ['All', 'Exams', 'Fees', 'Class'].map((label) => ({
      label, bg: label === this.state.filter ? '#172042' : '#FFFFFF', fg: label === this.state.filter ? '#FFFFFF' : '#172042',
      pick: () => this.setState({ filter: label })
    }));
    return { tabs, filters, notices: this.state.filter === 'All' ? all : all.filter((n) => n.tag === this.state.filter) };
  }
}
</script>
</body>
</html>
