<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App: Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif">
  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; color: #5A6482">Concept · Sample data</p>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">Messages</h1>
      <a href="XChat.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; background: #2F45A0; color: #FFFFFF; border-radius: 14px; font-size: 14px; font-weight: 700; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        New
      </a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; background: #E7EBF6; border-radius: 16px">
      <sc-for list="{{tabsTop}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" style="min-height: 42px; background: {{t.bg}}; color: #172042; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #E2F4EE; border-radius: 16px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16705A" stroke-width="1.8" stroke-linecap="round"><path d="M12 7v5l3 3M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0"></path></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #12503F">Teachers reply between 8 am and 4 pm on school days. Urgent school alerts also come by SMS.</p>
    </div>

    <sc-for list="{{threads}}" as="m" hint-placeholder-count="5">
      <a href="{{m.href}}" style="display: flex; gap: 12px; align-items: center; padding: 14px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 18px; color: inherit; text-decoration: none">
        <span aria-hidden="true" style="flex-shrink: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: {{m.bg}}; color: {{m.fg}}; border-radius: 50%; font-size: 16px; font-weight: 800">{{m.initial}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: 800">{{m.name}}</span>
            <span style="flex-shrink: 0; font-size: 12px; color: #5A6482">{{m.time}}</span>
          </span>
          <span style="font-size: 12px; font-weight: 600; color: {{m.fg}}">{{m.role}}</span>
          <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
            <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; color: #5A6482">{{m.preview}}</span>
            <sc-if value="{{m.unread}}" hint-placeholder-val="{{ false }}">
              <span style="flex-shrink: 0; min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #2F45A0; color: #FFFFFF; border-radius: 11px; font-size: 12px; font-weight: 800">{{m.count}}</span>
            </sc-if>
          </span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 14px; background: #FFFFFF; border-top: 1px solid #E3E7F2">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; color: {{tab.color}}; font-size: 11px; font-weight: 700; text-decoration: none">
        <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; background: {{tab.pill}}; border-radius: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg></span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab: 'All' };
  renderVals() {
    const active = 'Messages';
    const tabs = [
      { label: 'Home', href: 'XHome.dc.html', d: 'M3 11l9-8 9 8M5 10v10h14V10' },
      { label: 'Messages', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
      { label: 'Calendar', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Fees', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { label: 'Services', href: 'XServices.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' }
    ].map((t) => ({ ...t, color: t.label === active ? '#2F45A0' : '#5A6482', pill: t.label === active ? '#E9EDFB' : 'transparent' }));
    const all = [
      { type: 'Teachers', name: 'Ms. Farzana Ahmed', role: 'Class teacher · Aanya', initial: 'F', bg: '#E9EDFB', fg: '#2F45A0', preview: 'Aanya did very well in today’s maths quiz…', time: '5:12 pm', unread: true, count: '2', href: 'XChat.dc.html' },
      { type: 'School', name: 'Class IV-B updates', role: 'Announcements only', initial: 'IV', bg: '#EEEAFB', fg: '#5940AE', preview: 'Sports uniform is needed on Thursday', time: '1:40 pm', unread: true, count: '1', href: '#' },
      { type: 'School', name: 'Accounts office', role: 'Fees and receipts', initial: 'A', bg: '#FDF0DA', fg: '#8A5205', preview: 'Your June receipt is ready to download', time: 'Mon', unread: false, href: '#' },
      { type: 'Teachers', name: 'Mr. Shahed Rahim', role: 'Class teacher · Rayan', initial: 'S', bg: '#E2F4EE', fg: '#16705A', preview: 'Voice message · 0:24', time: 'Sun', unread: false, href: '#' },
      { type: 'School', name: 'Transport desk', role: 'Bus 3', initial: 'B', bg: '#FCE7E1', fg: '#A8432B', preview: 'Bus 3 will leave 10 minutes late today', time: 'Sun', unread: false, href: '#' }
    ];
    const tabsTop = ['All', 'Teachers', 'School'].map((label) => ({
      label,
      bg: label === this.state.tab ? '#FFFFFF' : 'transparent',
      pick: () => this.setState({ tab: label })
    }));
    return { tabs, tabsTop, threads: this.state.tab === 'All' ? all : all.filter((m) => m.type === this.state.tab) };
  }
}
</script>
</body>
</html>
