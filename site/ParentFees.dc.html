<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Parent app: Fee details and receipts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
.card{background:#FFFFFF;border:1px solid #E3E7F2;border-radius:20px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
</style>
</helmet>
<div style="width: 390px; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif">
  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="XPay.dc.html" aria-label="Back to pay fees" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #172042">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800">Fee details</h1>
        <p style="margin: 0; font-size: 12px; font-weight: 600; color: #8A93AE">Aanya · Class IV-B · Concept · Sample data</p>
      </div>
    </div>

    <section class="card" style="display: flex; flex-direction: column; gap: 10px; padding: 18px">
      <p style="margin: 0; font-size: 13px; font-weight: 700; color: #7A4904">November · due 30 Nov</p>
      <div class="row"><span style="color: #5A6482">Tuition</span><span style="font-weight: 700">BDT 6,500</span></div>
      <div class="row"><span style="color: #5A6482">Exam fee</span><span style="font-weight: 700">BDT 800</span></div>
      <div class="row"><span style="color: #5A6482">Activities</span><span style="font-weight: 700">BDT 500</span></div>
      <div class="row" style="padding-top: 10px; border-top: 1px solid #EEF1F8"><span style="font-weight: 800">Total</span><span style="font-size: 18px; font-weight: 800">BDT 7,800</span></div>
      <p style="margin: 0; font-size: 12px; color: #5A6482">Lunch plan (BDT 1,800) is billed separately each month.</p>
      <a href="XPay.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; background: #2F45A0; color: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 800; text-decoration: none">Pay BDT 7,800</a>
    </section>

    <h2 style="margin: 6px 0 0; font-size: 16px; font-weight: 800">Receipts</h2>
    <sc-for list="{{receipts}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 16px">
        <span aria-hidden="true" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #E2F4EE; color: #16705A; border-radius: 12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"></path></svg>
        </span>
        <div style="flex: 1">
          <p style="margin: 0; font-size: 15px; font-weight: 800">{{r.title}}</p>
          <p style="margin: 2px 0 0; font-size: 13px; color: #5A6482">Paid {{r.date}} · {{r.via}}</p>
        </div>
        <button aria-label="Download {{r.title}} receipt" style="min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; background: #E9EDFB; color: #2F45A0; border: 0; border-radius: 12px; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 14px; background: #FFFFFF; border-top: 1px solid #E3E7F2">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; color: {{tab.color}}; font-size: 11px; font-weight: 700; text-decoration: none">
        <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; background: {{tab.pill}}; border-radius: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg></span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = 'Fees';
    const tabs = [
      { label: 'Home', href: 'XHome.dc.html', d: 'M3 11l9-8 9 8M5 10v10h14V10' },
      { label: 'Messages', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
      { label: 'Calendar', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Fees', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { label: 'Services', href: 'XServices.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' }
    ].map((t) => ({ ...t, color: t.label === active ? '#2F45A0' : '#5A6482', pill: t.label === active ? '#E9EDFB' : 'transparent' }));
    return {
      tabs,
      receipts: [
        { title: 'October fee · BDT 7,800', date: '8 Oct', via: 'Card' },
        { title: 'October lunch plan · BDT 1,800', date: '8 Oct', via: 'Card' },
        { title: 'September fee · BDT 7,800', date: '7 Sep', via: 'Internet banking' }
      ]
    };
  }
}
</script>
</body>
</html>
