<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>App: All services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:96px;color:#172042;font-size:12px;font-weight:700;text-decoration:none;text-align:center}
.ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:16px}
.bn{font-family:'Hind Siliguri',sans-serif;font-size:12px;font-weight:500;color:#5A6482;line-height:1.1}
</style>
</helmet>
<div style="width: 390px; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif">
  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; color: #5A6482">Concept · Sample data</p>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">All services</h1>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; background: #FFFFFF; border: 1px solid #D5DBEE; border-radius: 16px; color: #5A6482">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14a7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search services</span>
      <input value="{{q}}" onChange="{{search}}" placeholder="Search, e.g. fees or bus" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #172042">
    </label>
    
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <section style="padding: 16px 10px 8px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 20px">
        <h2 style="margin: 0 0 12px 6px; font-size: 15px; font-weight: 800">{{g.title}}</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 2px">
          <sc-for list="{{g.items}}" as="t" hint-placeholder-count="4">
            <a href="{{t.href}}" class="tile">
              <span class="ic" style="background: {{g.bg}}; color: {{g.fg}}"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg></span>
              {{t.label}}
              <span class="bn">{{t.bn}}</span>
              <sc-if value="{{t.later}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: -4px; right: 6px; padding: 2px 6px; background: #FDF0DA; color: #7A4904; border-radius: 8px; font-size: 10px; font-weight: 800">Later</span>
              </sc-if>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 14px; background: #FFFFFF; border-top: 1px solid #E3E7F2">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; color: {{tab.color}}; font-size: 11px; font-weight: 700; text-decoration: none">
        <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; background: {{tab.pill}}; border-radius: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg></span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  state = { q: '' };
  renderVals() {
    const active = 'Services';
    const tabs = [
      { label: 'Home', href: 'XHome.dc.html', d: 'M3 11l9-8 9 8M5 10v10h14V10' },
      { label: 'Messages', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
      { label: 'Calendar', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Fees', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { label: 'Services', href: 'XServices.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' }
    ].map((t) => ({ ...t, color: t.label === active ? '#2F45A0' : '#5A6482', pill: t.label === active ? '#E9EDFB' : 'transparent' }));
    const raw = [
      { title: 'Every day', bg: '#E9EDFB', fg: '#2F45A0', items: [
        { label: 'Notices', bn: 'নোটিশ', href: 'ParentNotices.dc.html', d: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0' },
        { label: 'Attendance', bn: 'উপস্থিতি', href: 'ParentAttendance.dc.html', d: 'M4 5h16v14H4zM8 12l3 3 5-6' },
        { label: 'Routine', bn: 'রুটিন', href: 'ParentRoutine.dc.html', d: 'M12 7v5l3 3M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0' },
        { label: 'Meals', bn: 'খাবার', href: 'XMeals.dc.html', d: 'M4 11h16a8 8 0 0 1-16 0zM8 7c0-1 1-1.5 1-3M12 7c0-1 1-1.5 1-3M16 7c0-1 1-1.5 1-3' }
      ] },
      { title: 'Learning', bg: '#EEEAFB', fg: '#5940AE', items: [
        { label: 'Homework', bn: 'বাড়ির কাজ', href: 'XHomework.dc.html', d: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11' },
        { label: 'Results', bn: 'ফলাফল', href: 'XResults.dc.html', d: 'M4 20V10M10 20V4M16 20v-7M2 20h20' },
        { label: 'Meetings', bn: 'মিটিং', href: 'XMeetings.dc.html', d: 'M9 11a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6' }
      ] },
      { title: 'Talk to school', bg: '#E2F4EE', fg: '#16705A', items: [
        { label: 'Messages', bn: 'বার্তা', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
        { label: 'Leave', bn: 'ছুটি', href: 'XLeave.dc.html', d: 'M4 6h16v14H4zM4 10h16M10 13l4 4M14 13l-4 4' },
        { label: 'Feedback', bn: 'মতামত', href: 'XFeedback.dc.html', d: 'M4 5h16v11H9l-5 4zM9 10h6' }
      ] },
      { title: 'Payments', bg: '#FDF0DA', fg: '#8A5205', items: [
        { label: 'Pay fees', bn: 'ফি', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
        { label: 'Receipts', bn: 'রসিদ', href: 'ParentFees.dc.html', d: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
        { label: 'Event fees', bn: 'ইভেন্ট ফি', href: 'XEvents.dc.html', d: 'M4 8h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z' }
      ] },
      { title: 'Campus life', bg: '#FCE7E1', fg: '#A8432B', items: [
        { label: 'Calendar', bn: 'ক্যালেন্ডার', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
        { label: 'Bus', bn: 'বাস', href: 'XBus.dc.html', d: 'M5 4h14v12H5zM5 10h14M8 19v-3M16 19v-3' },
        { label: 'Safe pickup', bn: 'নিরাপদে নেওয়া', href: 'XPickup.dc.html', d: 'M12 3l8 3v6c0 5-3.5 8-8 9c-4.5-1-8-4-8-9V6zM9 12l2 2 4-4' },
        { label: 'Settings', bn: 'সেটিংস', href: 'XSettings.dc.html', d: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4' }
      ] }
    ];
    const q = this.state.q.trim().toLowerCase();
    const groups = raw
      .map((g) => ({ ...g, items: g.items.map((t) => ({ later: false, ...t })).filter((t) => !q || t.label.toLowerCase().includes(q) || t.bn.includes(q)) }))
      .filter((g) => g.items.length);
    return { tabs, groups, q: this.state.q, search: (e) => this.setState({ q: e.target.value }) };
  }
}
</script>
</body>
</html>
