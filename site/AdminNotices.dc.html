<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin panel: Notices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; align-items: stretch; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <nav aria-label="Admin menu" style="flex: 1 1 240px; box-sizing: border-box; padding: 28px 18px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-right: 1px solid #E3E7F2">
    <p style="margin: 0; padding: 0 12px; font-size: 19px; font-weight: 700">School admin</p>
    <p style="margin: 2px 0 18px; padding: 0 12px; font-size: 12px; font-weight: 600; color: #2F45A0">Concept · Sample data</p>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="15">
      <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 38px; padding: 0 12px; background: {{m.bg}}; color: {{m.fg}}; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none">{{m.label}}</a>
    </sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px">
    <div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">New notice</h1>
      <p style="margin: 4px 0 0; font-size: 15px; color: #5A6482">Type here and see what parents will receive.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; align-items: start">
      <form style="display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Title
          <input value="{{title}}" onChange="{{setTitle}}" style="min-height: 46px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9D2EE; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 400">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Message
          <textarea rows="5" value="{{body}}" onChange="{{setBody}}" style="box-sizing: border-box; padding: 12px; border: 1px solid #C9D2EE; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 400; line-height: 1.5; resize: vertical"></textarea>
        </label>
        <div style="display: flex; flex-wrap: wrap; gap: 14px">
          <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Send to
            <select style="min-height: 46px; padding: 0 10px; border: 1px solid #C9D2EE; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400">
              <option>Class IV, all sections</option>
              <option>Whole school</option>
              <option>Class IV, Section B</option>
            </select>
          </label>
          <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Category
            <select style="min-height: 46px; padding: 0 10px; border: 1px solid #C9D2EE; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400">
              <option>Exams</option>
              <option>Fees</option>
              <option>School</option>
            </select>
          </label>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px">
          <p style="margin: 0; font-size: 14px; color: #5A6482">Reaches 126 families</p>
          <button type="button" onClick="{{send}}" style="min-height: 46px; padding: 0 22px; background: #2F45A0; color: #FFFFFF; border: 0; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{sendLabel}}</button>
        </div>
      </form>

      <section aria-label="Parent preview" style="justify-self: center; width: 320px; box-sizing: border-box; padding: 20px 16px; background: #172042; border-radius: 28px">
        <p style="margin: 0 0 12px; text-align: center; font-size: 13px; font-weight: 600; color: #FFFFFF">What parents see</p>
        <article style="display: flex; flex-direction: column; gap: 6px; padding: 16px; background: #FFFFFF; border-radius: 16px">
          <div style="display: flex; justify-content: space-between">
            <p style="margin: 0; font-size: 12px; font-weight: 700; color: #2F45A0">Exams</p>
            <p style="margin: 0; font-size: 12px; color: #5A6482">Just now</p>
          </div>
          <h2 style="margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700">{{title}}</h2>
          <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5A6482">{{body}}</p>
        </article>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = {
    title: 'Half-yearly exam routine for Class IV',
    body: 'Exams begin on 22 November. Please check the subject dates.',
    sent: false
  };
  renderVals() {
    const active = 'Notices';
    const menu = [
      ['Dashboard', 'AdminDashboard'], ['Emergency alert', 'AEmergency'], ['Communication', 'XAdminComms'], ['Notices', 'AdminNotices'], ['Students and families', 'AFamilies'],
      ['Attendance', 'AdminAttendance'], ['Safe pickup', 'APickup'], ['Results', 'AResults'], ['Routine and calendar', 'ACalendar'], ['Events', 'AEvents'],
      ['Meals', 'AMeals'], ['Fees', 'AdminFees'], ['Fee setup', 'AFeeSetup'], ['Transport', 'ATransport'], ['Feedback', 'AFeedback']
    ].map(([label, f]) => ({ label, href: f + '.dc.html', bg: label === active ? '#E8ECF9' : 'transparent', fg: label === active ? '#2F45A0' : '#3F4A68' }));
    return {
      menu,
      title: this.state.title,
      body: this.state.body,
      sendLabel: this.state.sent ? 'Sent to parents' : 'Send notice',
      setTitle: (e) => this.setState({ title: e.target.value, sent: false }),
      setBody: (e) => this.setState({ body: e.target.value, sent: false }),
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
<a href="index.html" id="allscreens" style="position:fixed;right:18px;bottom:18px;z-index:99;display:flex;align-items:center;min-height:42px;padding:0 16px;background:#172042;color:#fff;border-radius:21px;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 20px rgba(23,32,66,.25)">← All screens</a>
</body>
</html>
