<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>App: Leave request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
.lbl{margin:0;font-size:14px;font-weight:800}
</style>
</helmet>
<div style="width: 390px; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F7FC; color: #172042; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif">
  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; color: #5A6482">Concept · Sample data</p>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="XServices.dc.html" aria-label="Back to services" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; color: #172042">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">Request leave</h1>
    </div>

    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px; padding: 18px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 20px">
        <p class="lbl">When?</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: -6px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
            <button onClick="{{d.pick}}" style="min-height: 46px; background: {{d.bg}}; color: {{d.fg}}; border: 1px solid #D5DBEE; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{d.label}}</button>
          </sc-for>
        </div>
        <p class="lbl">Reason</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: -6px">
          <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
            <button onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px; background: {{r.bg}}; color: {{r.fg}}; border: 1px solid {{r.line}}; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
              {{r.label}}
            </button>
          </sc-for>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span class="lbl">Note for the teacher <span style="font-weight: 500; color: #5A6482">(optional)</span></span>
          <textarea rows="3" placeholder="For example: She has a fever." style="box-sizing: border-box; padding: 12px; border: 1px solid #D5DBEE; border-radius: 12px; font: inherit; font-size: 15px; line-height: 1.5"></textarea>
        </label>
        <button style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; background: #F5F7FC; color: #2F45A0; border: 1px dashed #B5C0E6; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Add doctor’s note photo</button>
        <button onClick="{{send}}" style="min-height: 52px; background: #2F45A0; color: #FFFFFF; border: 0; border-radius: 14px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Send to class teacher</button>
      </div>
    </sc-if>

    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 18px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 20px">
        <div style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #E2F4EE; color: #16705A; border-radius: 50%">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"></path></svg>
        </div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800">Request sent</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5A6482">{{summary}} Ms. Farzana Ahmed will see it in the morning register. You will get a message when it is approved.</p>
        <button onClick="{{reset}}" style="min-height: 46px; background: #E9EDFB; color: #2F45A0; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Make another request</button>
      </div>
    </sc-if>

    <h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 800">Past requests</h2>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3E7F2; border-radius: 16px">
      <div><p style="margin: 0; font-size: 15px; font-weight: 700">Sick · 3 November</p><p style="margin: 2px 0 0; font-size: 13px; color: #5A6482">1 day</p></div>
      <span style="padding: 5px 10px; background: #E2F4EE; color: #12503F; border-radius: 10px; font-size: 12px; font-weight: 800">Approved</span>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 14px; background: #FFFFFF; border-top: 1px solid #E3E7F2">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="{{tab.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 54px; color: {{tab.color}}; font-size: 11px; font-weight: 700; text-decoration: none">
        <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; background: {{tab.pill}}; border-radius: 15px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg></span>
        {{tab.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { day: 'Tomorrow', reason: 'Sick', sent: false };
  renderVals() {
    const active = 'Services';
    const tabs = [
      { label: 'Home', href: 'XHome.dc.html', d: 'M3 11l9-8 9 8M5 10v10h14V10' },
      { label: 'Messages', href: 'XMessages.dc.html', d: 'M4 5h16v11H9l-5 4z' },
      { label: 'Calendar', href: 'XEvents.dc.html', d: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Fees', href: 'XPay.dc.html', d: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { label: 'Services', href: 'XServices.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' }
    ].map((t) => ({ ...t, color: t.label === active ? '#2F45A0' : '#5A6482', pill: t.label === active ? '#E9EDFB' : 'transparent' }));
    const days = ['Today', 'Tomorrow', 'Pick dates'].map((label) => ({
      label,
      bg: label === this.state.day ? '#172042' : '#FFFFFF',
      fg: label === this.state.day ? '#FFFFFF' : '#172042',
      pick: () => this.setState({ day: label })
    }));
    const reasons = [
      { label: 'Sick', d: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
      { label: 'Family event', d: 'M9 11a3 3 0 1 0 0-6a3 3 0 0 0 0 6zM3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6' },
      { label: 'Travel', d: 'M5 4h14v12H5zM5 10h14M8 19v-3M16 19v-3' },
      { label: 'Other', d: 'M5 12h.01M12 12h.01M19 12h.01' }
    ].map((r) => {
      const on = r.label === this.state.reason;
      return { ...r, bg: on ? '#FCE7E1' : '#FFFFFF', fg: on ? '#8A3522' : '#172042', line: on ? '#E9A894' : '#D5DBEE', pick: () => this.setState({ reason: r.label }) };
    });
    return {
      tabs,
      days,
      reasons,
      sent: this.state.sent,
      notSent: !this.state.sent,
      summary: this.state.reason + ' leave for ' + this.state.day.toLowerCase() + ' is sent.',
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
